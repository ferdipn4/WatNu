<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<div id="root"></div>
<script>
  var W = window.WatNu, h = React.createElement;
  function Demo() {
    var s = React.useState({ 2: true });
    var saved = s[0], setSaved = s[1];
    function card(i, props) {
      return h(W.EventCard, Object.assign({ key: i, saved: !!saved[i], onSave: function (v) { var n = Object.assign({}, saved); n[i] = v; setSaved(n); }, onClick: function () {} }, props));
    }
    var poster = h('svg', { viewBox: '0 0 358 201', width: '100%', height: '100%', preserveAspectRatio: 'xMidYMid slice', role: 'img', 'aria-label': 'Salsa Night poster' },
      h('rect', { width: 358, height: 201, fill: '#d01f29' }),
      h('path', { d: 'M-10 130c40-30 80-30 120 0s80 30 120 0 80-30 120 0 40 30 60 30v60H-10z', fill: '#ffffff', opacity: .18 }),
      h('path', { d: 'M-10 158c40-30 80-30 120 0s80 30 120 0 80-30 120 0 40 30 60 30v40H-10z', fill: '#ffffff', opacity: .28 }),
      h('text', { x: 24, y: 80, fill: '#ffffff', fontSize: 54, fontFamily: 'var(--font-display)', fontWeight: 800, letterSpacing: '-0.02em' }, 'SALSA'),
      h('text', { x: 24, y: 128, fill: 'none', stroke: '#ffffff', strokeWidth: 1.5, fontSize: 54, fontFamily: 'var(--font-display)', fontWeight: 800, letterSpacing: '-0.02em' }, 'NIGHT'));
    return h('div', { className: 'wn-preview-col' },
      card(0, { title: 'Beginners Salsa Night', time: '20:00', endTime: '23:00', location: 'Café Mestreech', organizer: 'Salsa Sociëteit', category: 'Party', price: 0, newcomers: true, image: poster }),
      card(1, { title: 'Beginners Salsa Night', time: '20:00', endTime: '23:00', location: 'Café Mestreech', organizer: 'Salsa Sociëteit', category: 'Party', price: 0, newcomers: true }),
      card(2, { title: 'Techno Night: Loods Maas', time: '23:00', location: 'Loods Maas', organizer: 'Loods Maas', category: 'Party', price: 8 }),
      card(3, { title: 'Consulting Case Workshop with alumni from three Amsterdam firms', time: '18:00', endTime: '20:00', location: 'SBE, Tongersestraat', organizer: 'SBE Career Club', category: 'Study & Career', price: 0, newcomers: true })
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

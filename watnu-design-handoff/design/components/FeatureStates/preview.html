<!-- @dsCard group="Structure" height=560 width=880 page subtitle="how a feature looks in each status of features.ts: live · local · soon · off" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature states — WatNu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 16px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .col > .wn-caption { padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .col .wn-heading { font-size: 16px; line-height: 20px; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var W = window.WatNu, h = React.createElement;
  var stats = h(W.Card, { tone: 'maas', className: 'wn-row' },
    h('div', { style: { flex: 1 } },
      h('div', { className: 'wn-caption wn-maas', style: { marginBottom: 4 } }, 'Promo codes redeemed · Sep'),
      h('div', { className: 'wn-row', style: { gap: 8, alignItems: 'baseline' } }, h('span', { className: 'wn-stat' }, '42'), h('span', { className: 'wn-meta wn-maas' }, '+12 vs August'))));
  function Col(props) { return h('div', { className: 'col' }, h('span', { className: 'wn-caption' }, props.status), h('div', { className: 'wn-heading' }, props.title), h('p', { className: 'wn-meta' }, props.rule), props.children); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' },
      h(Col, { status: 'live', title: 'Backed by the backend', rule: 'The control looks and works as designed. Nothing extra.' },
        h(W.Button, { variant: 'secondary', icon: 'calendar' }, 'Add to calendar'),
        stats,
        h('span', { className: 'code' }, "calendarExport: 'live'")
      ),
      h(Col, { status: 'local', title: 'Works on this phone only', rule: 'Saved in localStorage, no account. The hint says so once, where the data lives.' },
        h(W.Button, { variant: 'secondary', icon: h(W.Icon, { name: 'bookmark', filled: true }) }, 'Saved'),
        h('p', { className: 'wn-meta' }, 'Saved events and follows live on this phone — no account needed.'),
        h('span', { className: 'code' }, "save: 'local', follow: 'local'")
      ),
      h(Col, { status: 'soon', title: 'Designed, not built yet', rule: 'Stays visible in its place, dashed and muted with a Soon tag. Tapping shows the info Toast; nothing else happens.' },
        h(W.Button, { soon: true, icon: 'calendar' }, 'Add to calendar'),
        h(W.WarningPanel, { tone: 'soon', title: 'Organizer stats arrive with the next version' }, 'You will see how many people redeemed your code here.'),
        h(W.Toast, { tone: 'info', className: 'wn-toast-static' }, 'Not in this version yet — coming soon'),
        h('span', { className: 'code' }, "calendarExport: 'soon', organizerStats: 'soon'")
      ),
      h(Col, { status: 'off', title: 'Not part of this product', rule: 'Rendered nowhere: no tag, no placeholder, no empty card. The layout closes up as if it never existed.' },
        h(W.Card, { tone: 'sunken', tight: true }, h('div', { className: 'wn-meta' }, '(the promo card is simply absent when promoCodes is off)')),
        h('span', { className: 'code' }, "promoCodes: 'off'")
      )
    )
  );
</script>
</body>
</html>

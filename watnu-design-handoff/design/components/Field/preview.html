<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
  var W = window.WatNu, h = React.createElement;
  function Demo() {
    var t = React.useState('Board Game Night'), on = React.useState(true), q = React.useState('');
    return h('div', { className: 'wn-preview-col' },
      h(W.Field, { label: 'Title', value: t[0], onChange: t[1] }),
      h('div', { className: 'wn-grid-2' },
        h(W.Field, { label: 'Start', value: '19:30', onChange: function () {} }),
        h(W.Field, { label: 'End', placeholder: 'Add time', missing: true, onChange: function () {} })
      ),
      h(W.Field, { label: 'Category', kind: 'select', value: 'Social', trailing: h('span', { className: 'wn-maas' }, 'AI guess') }),
      h(W.Field, { kind: 'search', placeholder: 'Search associations, cafés, clubs', value: q[0], onChange: q[1] }),
      h(W.Field, { kind: 'switch', label: 'Newcomers welcome', checked: on[0], onChange: on[1], hint: 'Shows a badge; new students filter on it' }),
      h(W.Field, { label: 'Description', kind: 'textarea', value: 'Bring a game or join a table. Beginners welcome, all games explained in English.', onChange: function () {} })
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

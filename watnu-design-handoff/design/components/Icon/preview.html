<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px 8px; padding: 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cell span { font: 500 11px/14px var(--font-sans); color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var W = window.WatNu, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' }, W.icons.map(function (n) {
      return h('div', { key: n, className: 'cell' }, h(W.Icon, { name: n, size: 24, title: n }), h('span', null, n));
    }))
  );
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OrganizerCard — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
  var W = window.WatNu, h = React.createElement;
  function Demo() {
    var s = React.useState({ 2: true });
    var f = s[0], setF = s[1];
    function row(i, props) {
      return h(W.OrganizerCard, Object.assign({ key: i, following: !!f[i], onFollow: function (v) { var n = Object.assign({}, f); n[i] = v; setF(n); }, onClick: function () {} }, props));
    }
    return h('div', { className: 'wn-preview-col' },
      row(1, { name: 'Salsa Sociëteit', type: 'association', category: 'Party' }),
      row(2, { name: 'Maas Rowing', type: 'association', category: 'Sport', initials: 'MR' }),
      h(W.OrganizerCard, { name: 'Café Mestreech', type: 'cafe', category: 'Café & Food', initials: 'CM', onFollow: null, onClick: function () {} }),
      h(W.OrganizerCard, { name: 'Loods Maas', type: 'club', category: 'Party', initials: 'LM', onFollow: null, onClick: function () {} })
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

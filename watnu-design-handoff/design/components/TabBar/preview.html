<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TabBar — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
  var W = window.WatNu, h = React.createElement;
  function Demo() {
    var s = React.useState('week');
    return h('div', { style: { position: 'relative', width: 390, height: 150, overflow: 'hidden' } },
      h(W.TabBar, { active: s[0], onChange: function (t) { if (t !== 'create') s[1](t); } })
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

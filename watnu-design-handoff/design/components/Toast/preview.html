<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
  var W = window.WatNu, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wn-preview-col' },
      h(W.Toast, { tone: 'done', className: 'wn-toast-static' }, 'Published — it\u2019s live for everyone in Maastricht'),
      h(W.Toast, { tone: 'info', className: 'wn-toast-static' }, 'Not in this version yet — coming soon'),
      h(W.Toast, { tone: 'info', icon: 'bookmark', action: 'Undo', className: 'wn-toast-static' }, 'Removed from My WatNu')
    )
  );
</script>
</body>
</html>

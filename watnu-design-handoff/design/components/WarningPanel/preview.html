<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WarningPanel — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
  var W = window.WatNu, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wn-preview-col' },
      h(W.WarningPanel, { tone: 'conflict', title: '3 other events Thursday evening, 2 of them Sport' }, 'Yours is Social, so you are not competing head-on. Still, 19:30 is a busy slot.'),
      h(W.WarningPanel, { tone: 'duplicate', title: 'Is this the same as "Board Game Evening"?', actions: [
        h(W.Button, { key: 'y', size: 'sm', variant: 'outline' }, 'Yes, same event'),
        h(W.Button, { key: 'n', size: 'sm', variant: 'primary' }, 'No, different')
      ] }, 'SV Mosa · Thursday 19:30 · Café Mestreech'),
      h(W.WarningPanel, { tone: 'suggestion', title: 'Wednesday is quieter: 1 event', actions: [
        h(W.Button, { key: 'm', size: 'sm', variant: 'outline' }, 'Move to Wednesday')
      ] }, 'Same venue, same time; 340 people opened Wednesday events last week.'),
      h(W.WarningPanel, { tone: 'soon', title: 'Duplicate check is not in this version yet' }, 'We will compare your event with the week before it goes live. For now, have a look at Thursday yourself.')
    )
  );
</script>
</body>
</html>
